# Copy to buildbuddy.yaml in the consuming repository, replace OWNER/REPO, and
# replace "main" in --default-branch with the repository's default branch.
# The action name must stay "Complexity comparison": the ci-toolkit trigger
# matches that commit-status context exactly.
actions:
  - name: "Complexity comparison"
    self_hosted: true
    pool: "linux-amd64-kvm"
    platform_properties:
      workload-isolation-type: "none"
      container-image: "none"
      resources:bazzite-host: "1"
    resource_requests: { disk: 10GB }
    timeout: 130m
    allow_concurrent_runs: false
    # Runs only on pushes to the repository's own branches, never on
    # pull_request events; a pushed branch is compared against its open
    # pull request.
    triggers:
      push:
        branches:
          - "*"
          - "!gh-readonly-queue/*"
    steps:
      # --default-branch must name the default branch. Without it the runner
      # falls back to GIT_REPO_DEFAULT_BRANCH and then to "main", which makes a
      # trunk/master push look like a feature branch with no open pull request,
      # so it is skipped and no baseline is published.
      - run: >-
          /var/lib/llm-cc/bin/llm-cc-coordinate
          --repository OWNER/REPO
          --default-branch main
