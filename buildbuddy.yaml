actions:
  - name: "CPU build and test"
    container_image: "ubuntu-24.04"
    allow_concurrent_runs: false
    allow_concurrent_runs_on_branches:
      - "main"
      - "gh-readonly-queue/*"
    triggers:
      push:
        branches:
          - "main"
          - "gh-readonly-queue/*"
      pull_request:
        branches:
          - "main"
    steps:
      - run: "tools/check_format.sh"
      - run: "bazel test --config=buildbuddy //..."
      - run: "bazel build --config=buildbuddy --config=release --config=portable --config=cpu //:llm-cc"
      - run: "tools/check_glibc_version.sh bazel-bin/llm-cc"
      - run: "tools/check_static_link.sh bazel-bin/llm-cc"
