api_version: ci-toolkit/v1alpha1

automations:
  - id: cuda-backend-bundle
    triggers:
      - id: successful-gpu-build
        uses: github.commit-status@v1
        with:
          event: github.commit_status
          states: [success]
          targets:
            - pull_request:
                state: open
                base_branches: ["*"]
            - default_branch: {}
          status:
            context: GPU backends
            creator:
              login: buildbuddy-io[bot]
              id: 130678843
            target_url:
              scheme: https
              host: pawel.buildbuddy.io
              path_pattern: /invocation/{uuid}
            require_target_head_sha: true
    sources:
      - id: cuda-bundle
        uses: buildbuddy.workflow-artifact@v1
        with:
          invocation_url: "{{ event.target_url }}"
          artifact: llm-cc-backend-cuda-linux-x86_64.bundle
          expected:
            media_type: application/octet-stream
            max_bytes: 4294967296
    actions:
      - id: publish-cuda-bundle
        uses: toolkit.public-artifact@v1
        with:
          source: cuda-bundle
          security_profile: untrusted-data
          retention: 90d
      - id: comment-cuda-bundle
        uses: github.pull-request-comment@v1
        needs: [publish-cuda-bundle]
        when:
          target: pull_request
        with:
          operation: upsert
          marker: "<!-- ci-toolkit:cuda-backend-bundle -->"
          body: |
            <!-- ci-toolkit:cuda-backend-bundle -->
            [CUDA bundle]({{ actions.publish-cuda-bundle.outputs.public_url | markdown_url_escape }})

