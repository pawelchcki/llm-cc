api_version: ci-toolkit/v1alpha1

pull_requests:
  title:
    format: conventional-commits

releases:
  uses: toolkit.release-please@v1
  with:
    strategy: simple
    version_file: version.txt
    # Create the tag to trigger release.yml. That workflow owns the draft,
    # uploads every verified artifact, and only then publishes the release.
    skip_github_release: true

# GPU bundles and comparison reports are declared in .runnerless-ci.ts.
