# Copy to buildbuddy.yaml in the consuming repository and replace OWNER/REPO.
# The action name must stay "Complexity comparison": the ci-toolkit trigger
# matches that commit-status context exactly.
actions:
  - name: "Complexity comparison"
    self_hosted: true
    pool: "linux-amd64-rocm"
    platform_properties:
      workload-isolation-type: "none"
      container-image: "none"
      debug-executor-labels: "machine=bazzite"
    resource_requests: { disk: 10GB }
    timeout: 130m
    allow_concurrent_runs: false
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "main"
    steps:
      - run: "/var/lib/llm-cc/bin/llm-cc-coordinate --repository OWNER/REPO"
