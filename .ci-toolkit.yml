api_version: ci-toolkit/v1alpha1

automations:
  - id: llm-cc-backends
    triggers:
      - id: successful-status-push
        uses: github.commit-status@v1
        with:
          event: github.commit_status
          states:
            - success
          targets:
            - pull_request:
                state: open
                base_branches:
                  - "*"
          status:
            context: GPU backends
            creator:
              login: buildbuddy-io[bot]
              id: 130678843
            target_url:
              scheme: https
              host: pawel.buildbuddy.io
              path_pattern: /invocation/{uuid}
            require_target_head_sha: true

    sources:
      - id: cuda-bundle
        uses: buildbuddy.workflow-artifact@v1
        with:
          invocation_url: "{{ event.target_url }}"
          artifact: llm-cc-backend-cuda-linux-x86_64.bundle
          expected:
            media_type: application/octet-stream
            # Four GiB leaves generous headroom for the roughly gigabyte-scale ROCm closure.
            max_bytes: 4294967296

      - id: rocm-bundle
        uses: buildbuddy.workflow-artifact@v1
        with:
          invocation_url: "{{ event.target_url }}"
          artifact: llm-cc-backend-rocm-linux-x86_64.bundle
          expected:
            media_type: application/octet-stream
            # Keep the same four-GiB ceiling for both backend artifact sources.
            max_bytes: 4294967296

    actions:
      - id: publish-cuda-bundle
        uses: toolkit.public-artifact@v1
        with:
          source: cuda-bundle
          destination: public-artifacts
          immutable: true
          visibility: public
          checksum: sha256
          retention: 90d
          # The resolver Worker is not deployed yet. Until it is, use
          # `llm-cc backends fetch <name> --url <public_url>` with the URL from
          # the CI comment.
          resolver:
            key: "{{ commit.sha }}"

      - id: publish-rocm-bundle
        uses: toolkit.public-artifact@v1
        with:
          source: rocm-bundle
          destination: public-artifacts
          immutable: true
          visibility: public
          checksum: sha256
          retention: 90d
          # The resolver Worker is not deployed yet. Until it is, use
          # `llm-cc backends fetch <name> --url <public_url>` with the URL from
          # the CI comment.
          resolver:
            key: "{{ commit.sha }}"

      - id: comment-on-pull-request
        uses: github.pull-request-comment@v1
        needs:
          - publish-cuda-bundle
          - publish-rocm-bundle
        when:
          target: pull_request
        with:
          operation: upsert
          marker: "<!-- ci-toolkit:llm-cc-backends -->"
          body: |
            <!-- ci-toolkit:llm-cc-backends -->
            ## GPU backend bundles

            ### CUDA

            - **Public URL:** {{ actions.publish-cuda-bundle.outputs.public_url | markdown_url_escape }}
            - **SHA-256:** `{{ actions.publish-cuda-bundle.outputs.sha256 | markdown_escape }}`
            - **Available until:** `{{ actions.publish-cuda-bundle.outputs.expires_at | markdown_escape }}`
            - **Stable resolver:** https://ci-artifacts.pawelchcki.workers.dev/pawelchcki/llm-cc/{{ commit.sha }}/llm-cc-backend-cuda-linux-x86_64.bundle

            The resolver Worker is not deployed yet. Until it is, the supported path is
            `llm-cc backends fetch cuda --url {{ actions.publish-cuda-bundle.outputs.public_url | markdown_escape }}`
            using the Public URL above.

            ### ROCm

            - **Public URL:** {{ actions.publish-rocm-bundle.outputs.public_url | markdown_url_escape }}
            - **SHA-256:** `{{ actions.publish-rocm-bundle.outputs.sha256 | markdown_escape }}`
            - **Available until:** `{{ actions.publish-rocm-bundle.outputs.expires_at | markdown_escape }}`
            - **Stable resolver:** https://ci-artifacts.pawelchcki.workers.dev/pawelchcki/llm-cc/{{ commit.sha }}/llm-cc-backend-rocm-linux-x86_64.bundle

            The resolver Worker is not deployed yet. Until it is, the supported path is
            `llm-cc backends fetch rocm --url {{ actions.publish-rocm-bundle.outputs.public_url | markdown_escape }}`
            using the Public URL above.
