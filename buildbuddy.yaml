actions:
  - name: "CPU build and test"
    container_image: "ubuntu-24.04"
    resource_requests:
      disk: 40GB
    allow_concurrent_runs: false
    allow_concurrent_runs_on_branches:
      - "main"
      - "gh-readonly-queue/*"
    triggers:
      push:
        branches:
          - "main"
          - "gh-readonly-queue/*"
      pull_request:
        branches:
          - "main"
    steps:
      - run: "tools/check_format.sh"
      - run: "bazel test --config=buildbuddy //:unit"
      - run: "bazel test --config=buildbuddy //:integration"
      - run: "bazel build --config=buildbuddy --config=release --config=portable //dist:linux_x86_64"
      - run: "tools/check_glibc_version.sh bazel-bin/dist/llm-cc-0.1-linux-x86_64 2.28"
      - run: "tools/check_static_link.sh bazel-bin/dist/llm-cc-0.1-linux-x86_64"
