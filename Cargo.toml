[package]
name = "rethink-cc"
version = "0.1.0"
edition = "2024"
description = "Teacher-forced token probability extraction for local GGUF language models"
license = "MIT"
repository = "https://github.com/pawelchcki/rethink-cc"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
rocm = ["llama-cpp-2/rocm"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
llama-cpp-2 = "0.1.154"
serde_json = "1.0.151"
