name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets (requires selecting an existing version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  binaries:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, backend: cpu, binary: llm-cc }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, backend: cpu, binary: llm-cc }
          - { platform: windows-x86_64, runner: windows-2025, backend: cpu, binary: llm-cc.exe }
          - { platform: macos-arm64, runner: macos-15, backend: metal, binary: llm-cc }
          - { platform: macos-x86_64, runner: macos-15-intel, backend: metal, binary: llm-cc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: release-${{ matrix.platform }}
          repository-cache: true
      - name: Configure Windows toolchain
        if: runner.os == 'Windows'
        run: |
          echo 'BAZEL_SH=C:/Program Files/Git/bin/bash.exe' >> "$GITHUB_ENV"
      - name: Prepare release stamp
        id: release
        run: tools/release_ref.sh
      - name: Test and build distribution binary
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python tools/release_assets_test.py
          bazel test --config=distribution --config="$BACKEND" --lockfile_mode=off --jobs=4 --test_output=errors //:unit //:integration
          bazel build --config=distribution --config="$BACKEND" --lockfile_mode=off --jobs=4 //:llm-cc
      - name: Verify Linux runtime compatibility
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          floor=2.28
          if [[ "$PLATFORM" == linux-arm64 ]]; then floor=2.35; fi
          tools/check_glibc_version.sh bazel-bin/llm-cc "$floor"
          tools/check_static_link.sh bazel-bin/llm-cc
      - name: Stage standalone executable
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          python tools/release_assets.py binary --version "$VERSION" --commit "$COMMIT" \
            --platform "$PLATFORM" --binary "bazel-bin/$BINARY" --output "$RUNNER_TEMP/release-assets"
      - name: Smoke test standalone package with a real model
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          LLM_CC_RUNTIME_DIR: ${{ runner.temp }}/smoke-runtime
          XDG_CACHE_HOME: ${{ runner.temp }}/smoke-models
        run: |
          suffix=""
          if [[ "$PLATFORM" == windows-x86_64 ]]; then suffix=.exe; fi
          binary="$RUNNER_TEMP/release-assets/llm-cc-$VERSION-$PLATFORM$suffix"
          cd "$RUNNER_TEMP"
          "$binary" --version
          "$binary" score --model-name qwen2.5-coder-0.5b-q4_k_m --prompt 'int add(int a, int b) { return a + b; }' \
            --force-cpu --assume-yes > smoke.json
          python -c 'import json; rows=[json.loads(line) for line in open("smoke.json")]; assert any(isinstance(row.get("log_probability"), (int, float)) for row in rows), rows'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  backends:
    name: Build Linux x86-64 ${{ matrix.backend }} bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, rocm]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare release stamp
        id: release
        run: tools/release_ref.sh
      - name: Reuse verified GPU bundle for this exact commit
        id: reuse
        env:
          BACKEND: ${{ matrix.backend }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          RESOLVER_BASE: ${{ vars.LLM_CC_RESOLVER_BASE || 'https://ci-toolkit.pawelchcki.workers.dev/artifacts' }}
        run: |
          stem="llm-cc-backend-$BACKEND-linux-x86_64"
          base="${RESOLVER_BASE%/}/pawelchcki/llm-cc/$COMMIT"
          mkdir -p "$RUNNER_TEMP/gpu-input"
          cd "$RUNNER_TEMP/gpu-input"
          for file in "$stem.manifest.json" "$stem.bundle.sha256" "$stem.bundle"; do
            if ! curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 600 \
                "$base/$file" --output "$file"; then
              echo 'hit=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if python "$GITHUB_WORKSPACE/tools/release_assets.py" backend --version "$VERSION" --commit "$COMMIT" \
              --backend "$BACKEND" --bundle "$stem.bundle" --manifest "$stem.manifest.json" \
              --output "$RUNNER_TEMP/release-assets"; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
      - name: Make room for pinned GPU toolchains
        if: steps.reuse.outputs.hit != 'true'
        run: |
          # Only disposable hosted-runner SDKs; none are inputs to our pinned build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: bazel-contrib/setup-bazel@0.19.0
        if: steps.reuse.outputs.hit != 'true'
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build bundle from tagged source when CI artifacts are unavailable
        if: steps.reuse.outputs.hit != 'true'
        env:
          BACKEND: ${{ matrix.backend }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          bazel build --config=release --config="$BACKEND" --lockfile_mode=off --jobs=4 "//dist:backend_$BACKEND"
          module="$(find -L bazel-bin/external -type f -path '*llama_cpp*' -name "libllm-cc-backend-$BACKEND.so" -print -quit)"
          tools/check_glibc_version.sh "$module" 2.28
          stem="llm-cc-backend-$BACKEND-linux-x86_64"
          python tools/release_assets.py backend --version "$VERSION" --commit "$COMMIT" --backend "$BACKEND" \
            --bundle "bazel-bin/dist/backend_$BACKEND/$stem.bundle" \
            --manifest "bazel-bin/dist/backend_$BACKEND/manifest.json" --output "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: release-backend-${{ matrix.backend }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Verify complete release
    needs: [binaries, backends]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare release stamp
        id: release
        run: tools/release_ref.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Require every platform, backend, checksum and matching commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python tools/release_assets.py verify --version "$VERSION" --commit "$COMMIT" --output "$RUNNER_TEMP/release-assets"
          python tools/release_bundle_smoke.py "$RUNNER_TEMP/release-assets" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: complete-release
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release packages
    needs: assemble
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.assemble.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: complete-release
          path: release-assets
      - name: Upload the verified complete asset set
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false
      - name: Verify publicly downloadable checksums and bundle metadata
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          curl --fail --location --retry 5 --retry-all-errors "$base/SHA256SUMS" -o published-checksums
          cmp release-assets/SHA256SUMS published-checksums
          for backend in cuda rocm; do
            name="llm-cc-backend-$backend-linux-x86_64.manifest.json"
            curl --fail --location --retry 5 --retry-all-errors "$base/$name" -o published-manifest
            cmp "release-assets/$name" published-manifest
          done
      - name: Install from GitHub and automatically fetch the released GPU bundles
        env:
          LLM_CC_RUNTIME_DIR: ${{ runner.temp }}/published-runtime
        run: |
          python3 release-assets/install_release.py --version "$TAG" --bin-dir "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/llm-cc" --version
          for backend in cuda rocm; do
            "$RUNNER_TEMP/installed/llm-cc" backends fetch "$backend" --assume-yes
            "$RUNNER_TEMP/installed/llm-cc" backends fetch "$backend" --no-download
          done
